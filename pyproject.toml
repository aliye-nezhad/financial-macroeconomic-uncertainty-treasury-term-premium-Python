[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us-treasury-uncertainty"
version = "0.1.0"
description = "A reproducible macro-finance forecasting study of uncertainty and Treasury term premia."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "requests>=2.31,<3.0",
    "xlrd>=2.0.1,<3.0",
    "openpyxl>=3.1,<4.0",
    "statsmodels>=0.14,<1.0",
    "scipy>=1.11,<2.0",
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
